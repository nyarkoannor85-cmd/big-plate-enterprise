<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendor Dashboard - Big Plate</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Replace with your background image URL or keep it styled nicely */
      background: #f4f4f9;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      width: 100%;
      max-width: 450px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      box-sizing: border-box;
    }
    h2 {
      color: #d35400;
      text-align: center;
      margin-top: 0;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #333;
      font-weight: bold;
    }
    input, button {
      display: block;
      width: 100%;
      margin-bottom: 15px;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }
    input:focus {
      border-color: #d35400;
      outline: none;
    }
    button {
      background: #e67e22;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
      transition: background 0.2s;
    }
    button:hover {
      background: #d35400;
    }
    .footer-text {
      text-align: center;
      font-size: 12px;
      color: #777;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Big Plate Dashboard</h2>
    <form id="upload-form">
      <label for="title">Food Title</label>
      <input type="text" id="title" placeholder="e.g. Jollof Rice & Chicken" required />

      <label for="price">Price</label>
      <input type="number" step="0.01" id="price" placeholder="0.00" required />

      <label for="image-file">Food Image</label>
      <input type="file" id="image-file" accept="image/*" required />

      <button type="submit">Post Meal</button>
    </form>
    <div class="footer-text">Designed & Developed by Titan</div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    // Paste your Supabase credentials here
    const supabaseUrl = 'https://iaqkorbstonyqhowhksr.supabase.co';
    const supabaseKey = 'sb_publishable_EQolnAMn2FBFEkLtA0DhPQ_dvjPGMQw';
    const supabase = createClient(supabaseUrl, supabaseKey);

    document.getElementById('upload-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const title = document.getElementById('title').value;
      const price = parseFloat(document.getElementById('price').value);
      const fileInput = document.getElementById('image-file');
      const file = fileInput.files[0];

      if (!file) return alert('Please select an image!');

      // 1. Upload image to 'food-images' bucket
      const fileName = ${Date.now()}_${file.name};
      const { data: uploadData, error: uploadError } = await supabase.storage
        .from('food-images')
        .upload(fileName, file);

      if (uploadError) {
        alert('Error uploading image: ' + uploadError.message);
        return;
      }

      // 2. Get public URL for the uploaded image
      const { data: urlData } = supabase.storage
        .from('food-images')
        .getPublicUrl(fileName);

      const imageUrl = urlData.publicUrl;

      // 3. Save listing details into the 'foods' database table
      const { error: dbError } = await supabase
        .from('foods')
        .insert([
          { 
            title: title, 
            price: price, 
            image_url: imageUrl, 
            vendor_email: "vendor@thebigplate.com" 
          }
        ]);
       if (dbError) {
        alert('Error saving to database: ' + dbError.message);
      } else {
        alert('Meal posted successfully!');
        document.getElementById('upload-form').reset();
      }
    });
  </script>

</body>
</html>
