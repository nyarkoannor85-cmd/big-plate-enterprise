<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Big Plate</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-family: Arial, sans-serif;
    }
    .auth-container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15) !important;
      border-radius: 8px;
      background: #fff !important;
    }
    .auth-box {
      text-align: center;
    }
    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }
    .input-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
    }
    .input-group input, 
    .input-group select {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
    }
    .btn {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #007bff;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    .btn:hover {
      background: #0056b3;
    }
    .toggle-links {
      margin-top: 15px;
      font-size: 14px;
    }
    .footer-credit {
      position: absolute;
      bottom: 20px;
      text-align: center;
      width: 100%;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <!-- Auth Section -->
  <div id="auth-section" class="auth-container">
    <div class="auth-box">
      <h1>Big Plate</h1>
      <p>Welcome. Please log in or sign up to access your dashboard.</p>
      
      <!-- Login Form -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="input-group">
          <input type="email" id="login-email" placeholder="Email Address" required>
        </div>
        <div class="input-group">
          <input type="password" id="login-password" placeholder="Password" required>
        </div>
        <button type="submit" class="btn">Log In</button>
      </form>

      <!-- Signup Form -->
      <form id="signup-form" onsubmit="handleSignup(event)" style="display:none;">
        <div class="input-group">
          <input type="email" id="signup-email" placeholder="Email Address" required>
        </div>
        <div class="input-group">
          <input type="password" id="signup-password" placeholder="Password" required>
        </div>
        <div class="input-group">
          <input type="text" id="signup-username" placeholder="Username / Display Name" required>
        </div>
        <div class="input-group">
          <input type="tel" id="signup-phone" placeholder="Telephone Number" required>
        </div>
        <div class="input-group">
          <input type="text" id="signup-ghana-card" placeholder="Ghana Card (GHA-123456789-1)" required>
        </div>
        <div class="input-group">
          <label for="signup-role">I am a:</label>
          <select id="signup-role" required>
            <option value="customer">Customer / Buyer</option>
            <option value="vendor">Vendor / Seller</option>
          </select>
        </div>
        <button type="submit" class="btn">Sign Up</button>
      </form>

      <!-- Toggle Links -->
      <div class="toggle-links">
        <span id="to-signup-wrap"><a href="#" onclick="showSignup(); return false;">Create an account</a></span> | 
        <span id="to-login-wrap" style="display:none;"><a href="#" onclick="showLogin(); return false;">Already have an account?</a></span>
      </div>
    </div>
  </div>

  <!-- Menu Section -->
  <div id="menu-section" style="display:none;">
    <div class="menu-container">
      <h1>Big Plate Dashboard</h1>
      <p>Access Granted! Your dashboard tools will load here.</p>
    </div>
  </div>

  <!-- Designer Credit -->
  <div class="footer-credit">
    <p>Designed & Developed by Titan</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    // Toggle logic functions
    function showSignup() {
      document.getElementById('login-form').style.display = 'none';
      document.getElementById('signup-form').style.display = 'block';
      document.getElementById('to-signup-wrap').style.display = 'none';
      document.getElementById('to-login-wrap').style.display = 'inline';
    }

    function showLogin() {
      document.getElementById('signup-form').style.display = 'none';

  <!-- Core Auth Logic -->
  <script src="auth.js"></script>
</body>
</html>
